# This file is included inside a server block.
charset utf-8;
autoindex off;
index home.php index.php;

# Block TRACE and TRACK HTTP methods
if ($request_method ~* ^(?:TRACE|TRACK)$) {
    return 403;
}

# Allow public standard files that would otherwise match blocked extensions
location = /robots.txt { try_files $uri =404; }
location = /ads.txt { try_files $uri =404; }
location = /app-ads.txt { try_files $uri =404; }
location = /humans.txt { try_files $uri =404; }
location = /.well-known/security.txt { try_files $uri =404; }
location = /manifest.json { try_files $uri =404; }
location = /.well-known/assetlinks.json { try_files $uri =404; }
location = /sitemap.xml { try_files $uri =404; }
location = /sitemap_index.xml { try_files $uri =404; }
location = /browserconfig.xml { try_files $uri =404; }

# Allow ACME HTTP-01 challenges under the public .well-known directory
location /.well-known/acme-challenge/ {
    try_files $uri =404;
}

# Block hidden files and path segments except the root .well-known directory
location ~ (?:^/(?!\.well-known(?:/|$))|/.+/)\. {
    return 403;
}

# Block sensitive file extensions
location ~* \.(?:bak|backup|old|orig|save|tmp|temp|swp|swo|rej|dist|sample|log|dump|sql|sqlite|sqlite3|db|ini|conf|cfg|cnf|pem|key|p12|pfx|jks|keystore|inc|phps|sh|rb|lock)$ {
    return 403;
}

# Block TXT files except the exact public files above
location ~* \.txt$ {
    return 403;
}

# Block JSON files except the exact public files above
location ~* \.json$ {
    return 403;
}

# Block XML files except the exact public files above
location ~* \.xml$ {
    return 403;
}

# Block YAML and Markdown files
location ~* \.(?:yaml|yml|md|markdown)$ {
    return 403;
}

# Block common extensionless development files
location ~* (?:^|/)(?:Dockerfile|Makefile|Vagrantfile|Procfile|Gemfile|Rakefile)$ {
    return 403;
}

# Block editor backup files
location ~ ~$ {
    return 403;
}

# Allow archives only inside these public download directories
location ~* ^/(?:downloads|releases)/.+\.(?:zip|rar|7z|tar|tgz|gz|bz2|xz)$ {
    try_files $uri =404;
}

# Block archives everywhere else
location ~* \.(?:zip|rar|7z|tar|tgz|gz|bz2|xz)$ {
    return 403;
}

# Route missing files and directories through the PHP front controller
location / {
    try_files $uri $uri/ /home.php?uri=$uri&$args;
}

# Use one PHP handler for supported Nginx errors
recursive_error_pages off;
error_page 400 401 403 404 500 502 503 504 /_error.php?e=$status;

# Apply safe baseline response headers, including generated error responses
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

# Pass existing PHP scripts to PHP-FPM; change fastcgi_pass for your environment
location ~ \.php$ {
    try_files $uri =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass 127.0.0.1:9000;
}
