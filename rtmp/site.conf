# This optional file is included inside the streaming server block.
listen 127.0.0.1:8080;

# Accept publishing callbacks only from the local RTMP service
location = /rtmp/auth.php {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    try_files /rtmp/auth.php =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/rtmp/auth.php;
    fastcgi_pass 127.0.0.1:9000;
}

# Serve generated live HLS files without enabling cross-origin access
location ^~ /tv/ {
    alias /var/lib/nginx/hls/;
    autoindex off;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    default_type application/octet-stream;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    limit_except GET HEAD {
        deny all;
    }
}
